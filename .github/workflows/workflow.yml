name: CI
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
    
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Install modules
              run: |
                  npm install
            - name: Run Prettier and ESLint
              run: |
                  npm run lint
